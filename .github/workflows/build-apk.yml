name: Build RightMeal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -q RightMeal-Lenta-android-build.zip -d source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Inspect project dependencies
        working-directory: source/RightMeal-main
        run: |
          echo "=== Python project configuration ==="
          cat pyproject.toml
          echo "=== fastembed references ==="
          grep -Rni "fastembed\|onnxruntime" . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude='*.lock' || true

      - name: Remove unsupported Android dependencies
        working-directory: source/RightMeal-main
        run: |
          uv remove fastembed onnxruntime --no-sync
          uv lock
          uv sync --locked

      - name: Build APK
        working-directory: source/RightMeal-main
        env:
          CI: "true"
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          uv run flet build apk --yes --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rightmeal-android-apk
          path: source/RightMeal-main/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7
