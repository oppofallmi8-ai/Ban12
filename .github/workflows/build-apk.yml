
name: Build RightMeal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -q RightMeal-Lenta-android-build.zip -d source

      - name: Build Android APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: source/RightMeal-main
          runner-python-version: "3.12"
          cache: false
          extra-args: "--exclude fastembed onnxruntime"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rightmeal-android-apk
          path: source/RightMeal-main/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7
