name: Build Android APK

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          unzip -o RightMeal-Lenta-android-build.zip -d source
          find source -maxdepth 3 -type f | head -100

      - name: Show project files
        run: ls -la source
