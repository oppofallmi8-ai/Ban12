
name: Build RightMeal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -q RightMeal-Lenta-android-build.zip -d source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Add startup diagnostics
        working-directory: source/RightMeal-main
        run: |
          cat > src/main.py <<'PY'
          """RightMeal Android startup diagnostics."""
          from pathlib import Path
          import traceback

          import flet as ft
          from dotenv import load_dotenv

          load_dotenv()
          ASSETS_DIR = str(Path(__file__).resolve().parent / "assets")

          def main(page: ft.Page):
              try:
                  from ui.app import main as app_main
                  app_main(page)
              except BaseException:
                  details = traceback.format_exc()
                  page.clean()
                  page.add(
                      ft.Column(
                          controls=[
                              ft.Text(
                                  "RIGHTMEAL: ОШИБКА ЗАПУСКА",
                                  size=22,
                                  weight=ft.FontWeight.BOLD,
                              ),
                              ft.Text(
                                  details,
                                  selectable=True,
                                  font_family="monospace",
                                  size=12,
                              ),
                          ],
                          scroll=ft.ScrollMode.AUTO,
                          expand=True,
                        )
                  )
                  page.update()

          if __name__ == "__main__":
              ft.run(main, assets_dir=ASSETS_DIR)
          PY

          echo "=== Diagnostic entry point ==="
          cat src/main.py

      - name: Remove unsupported Android dependency
        working-directory: source/RightMeal-main
        run: |
          uv remove fastembed --no-sync
          uv lock
          uv sync --locked

      - name: Build APK
        working-directory: source/RightMeal-main
        env:
          CI: "true"
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          uv run flet build apk --yes --arch arm64-v8a --exclude fastembed onnxruntime

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rightmeal-android-diagnostic
          path: source/RightMeal-main/build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
