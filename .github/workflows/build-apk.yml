name: Build RightMeal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -q RightMeal-Lenta-android-build.zip -d source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: source/RightMeal-main
        run: uv sync --locked

      - name: Build Android APK
        working-directory: source/RightMeal-main
        run: uv run flet build apk --arch arm64-v8a --exclude fastembed onnxruntime

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rightmeal-android-apk
          path: source/RightMeal-main/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7
